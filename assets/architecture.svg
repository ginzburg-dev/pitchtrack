<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="220" viewBox="0 0 1170 220" role="img" aria-labelledby="title desc">
  <title id="title">PitchTrack offline pipeline</title>
  <desc id="desc">Player detection and field geometry merge into pitch-coordinate tracks.</desc>
  <rect width="1170" height="220" fill="#ffffff"/>
  <text x="40" y="38" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="600">PitchTrack pipeline</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
  </defs>
  <g fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M190 91 H240"/><path d="M410 91 H460"/><path d="M630 91 H790"/>
    <path d="M410 161 H460"/><path d="M630 161 H710 V116 H790"/><path d="M960 91 H1010"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g><rect x="40" y="62" width="150" height="58" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><rect x="40" y="62" width="4" height="58" rx="2" fill="#57606a"/><text x="58" y="96" fill="#24292f" font-size="14" font-weight="600">Video frames</text></g>
    <g><rect x="240" y="62" width="170" height="58" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><rect x="240" y="62" width="4" height="58" rx="2" fill="#22a2c4"/><text x="258" y="96" fill="#24292f" font-size="14" font-weight="600">Player detection</text></g>
    <g><rect x="460" y="62" width="170" height="58" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><rect x="460" y="62" width="4" height="58" rx="2" fill="#22a2c4"/><text x="478" y="96" fill="#24292f" font-size="14" font-weight="600">Image-space tracks</text></g>
    <g><rect x="240" y="132" width="170" height="58" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><rect x="240" y="132" width="4" height="58" rx="2" fill="#7b61c9"/><text x="258" y="166" fill="#24292f" font-size="14" font-weight="600">Field observations</text></g>
    <g><rect x="460" y="132" width="170" height="58" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><rect x="460" y="132" width="4" height="58" rx="2" fill="#7b61c9"/><text x="478" y="166" fill="#24292f" font-size="14" font-weight="600">Dynamic homography</text></g>
    <g><rect x="790" y="62" width="170" height="58" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><rect x="790" y="62" width="4" height="58" rx="2" fill="#0969da"/><text x="808" y="96" fill="#24292f" font-size="14" font-weight="600">Pitch tracks</text></g>
    <g><rect x="1010" y="62" width="120" height="58" rx="4" fill="#f6f8fa" stroke="#d0d7de"/><rect x="1010" y="62" width="4" height="58" rx="2" fill="#0969da"/><text x="1028" y="96" fill="#24292f" font-size="14" font-weight="600">MP4 · JSONL</text></g>
